name: Release

# Push a tag like v1.3 to build the app and publish it as a GitHub release.
# Installed copies of GlassTrack pick the new release up through the in-app updater.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and package
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/package_release.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep hand-written notes if the release already exists; otherwise generate them.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/GlassTrack-*.zip build/GlassTrack-*.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/GlassTrack-*.zip build/GlassTrack-*.dmg \
              --title "GlassTrack ${GITHUB_REF_NAME#v}" --generate-notes
          fi
